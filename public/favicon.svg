<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Buffalo Plains Adventures">
  <!-- Background -->
  <rect width="64" height="64" rx="10" fill="#0B3D2E"/>

  <!-- Buffalo silhouette centred in the icon -->
  <g transform="translate(32, 30) scale(0.28)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="85" ry="55" fill="#F4A261"/>
    <!-- Head -->
    <circle cx="-70" cy="-15" r="28" fill="#F4A261"/>
    <!-- Left horn -->
    <path d="M -85 -20 Q -95 -35 -85 -45" stroke="#F4A261" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Right horn -->
    <path d="M -55 -20 Q -50 -38 -60 -48" stroke="#F4A261" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Eye -->
    <circle cx="-72" cy="-18" r="4" fill="#0B3D2E"/>
    <!-- Legs -->
    <rect x="-55" y="50" width="12" height="30" fill="#F4A261" rx="5"/>
    <rect x="-25" y="50" width="12" height="30" fill="#F4A261" rx="5"/>
    <rect x="15"  y="50" width="12" height="30" fill="#F4A261" rx="5"/>
    <rect x="45"  y="50" width="12" height="30" fill="#F4A261" rx="5"/>
    <!-- Tail -->
    <path d="M 80 5 Q 105 0 100 -15" stroke="#F4A261" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- "BP" text below as a subtle label -->
  <text x="32" y="60" font-family="Georgia, serif" font-size="7" font-weight="700" text-anchor="middle" fill="#F4A261" letter-spacing="1">BPA</text>
</svg>
