<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Buffalo Plains Adventures Logo">
  <defs>
    <linearGradient id="buffaloBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3D2E" />
      <stop offset="100%" stop-color="#1F6F50" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#F5F7F4"/>

  <!-- Title: BUFFALO PLAINS -->
  <text x="200" y="60" font-family="Playfair Display, Georgia, serif" font-size="52" font-weight="700" text-anchor="middle" fill="#0B3D2E" letter-spacing="3">
    BUFFALO PLAINS
  </text>

  <!-- Buffalo silhouette with jungle green -->
  <g transform="translate(200, 120)" filter="url(#shadow)">
    <!-- Buffalo body -->
    <ellipse cx="0" cy="0" rx="85" ry="55" fill="#0B3D2E"/>
    
    <!-- Buffalo head with horns -->
    <circle cx="-70" cy="-15" r="28" fill="#0B3D2E"/>
    <!-- Left horn -->
    <path d="M -85 -20 Q -95 -35 -85 -45" stroke="#0B3D2E" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Right horn -->
    <path d="M -55 -20 Q -50 -38 -60 -48" stroke="#0B3D2E" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Eye -->
    <circle cx="-72" cy="-18" r="4" fill="#F5F7F4"/>
    
    <!-- Buffalo legs -->
    <rect x="-55" y="50" width="12" height="35" fill="#0B3D2E" rx="6"/>
    <rect x="-25" y="50" width="12" height="35" fill="#0B3D2E" rx="6"/>
    <rect x="15" y="50" width="12" height="35" fill="#0B3D2E" rx="6"/>
    <rect x="45" y="50" width="12" height="35" fill="#0B3D2E" rx="6"/>
    
    <!-- Buffalo tail -->
    <path d="M 80 5 Q 105 0 100 -15" stroke="#0B3D2E" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Mountains/trees in background (subtle) -->
  <g opacity="0.15" transform="translate(200, 140)">
    <polygon points="-120,40 -100,-20 -80,40" fill="#0B3D2E"/>
    <polygon points="-60,40 -40,-25 -20,40" fill="#0B3D2E"/>
    <polygon points="0,40 20,-30 40,40" fill="#0B3D2E"/>
    <polygon points="60,40 80,-25 100,40" fill="#0B3D2E"/>
    <polygon points="120,40 140,-20 160,40" fill="#0B3D2E"/>
  </g>

  <!-- Subtitle: ADVENTURES -->
  <text x="200" y="275" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#F4A261" letter-spacing="2">
    ADVENTURES
  </text>

  <!-- Decorative accents -->
  <circle cx="40" cy="30" r="3" fill="#F4A261" opacity="0.6"/>
  <circle cx="360" cy="35" r="3" fill="#F4A261" opacity="0.6"/>
  <circle cx="45" cy="270" r="2.5" fill="#1F6F50" opacity="0.4"/>
  <circle cx="355" cy="275" r="2.5" fill="#1F6F50" opacity="0.4"/>
</svg>
